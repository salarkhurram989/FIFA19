<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FIFA19 — 3D Football Simulation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100a;font-family:Arial,sans-serif;color:#fff}body{touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;text-shadow:0 2px 4px #000}.score{position:absolute;top:14px;left:50%;transform:translateX(-50%);min-width:310px;padding:7px 18px;background:#070b0dcc;border:1px solid #ffffff30;border-radius:4px;text-align:center}.score b{font-size:23px;margin:0 15px}.score small{display:block;color:#ddd;margin-top:2px}.home{color:#ef3140}.away{color:#e9eef6}.team{font-weight:800}#status{position:absolute;top:15px;left:15px;padding:8px 11px;background:#0009;border-radius:4px;font-size:12px}.help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#0009;padding:7px 12px;border-radius:4px;font-size:11px;white-space:nowrap}.bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:240px;height:8px;background:#000b;border:1px solid #fff4;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff}.timed{position:absolute;top:91px;left:50%;transform:translateX(-50%) scale(.8);font-size:20px;font-weight:900;opacity:0;transition:.1s}.timed.show{opacity:1;transform:translateX(-50%) scale(1)}#cameraLabel{position:absolute;right:15px;top:15px;font-size:10px;opacity:.8}#touch{position:fixed;right:14px;bottom:45px;z-index:10;display:grid;grid-template-columns:repeat(2,65px);gap:7px;pointer-events:auto}.touchBtn{height:46px;border:1px solid #fff4;border-radius:9px;background:#05080dcc;color:#fff;font-weight:800;touch-action:none}.touchBtn.wide{grid-column:span 2}@media(min-width:701px){#touch{opacity:.35}}@media(max-width:700px){.help{display:none}#status{display:none}.score{top:6px}.bar{bottom:9px}}
#proHUD{position:absolute;right:15px;top:38px;display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:auto;font-size:9px;letter-spacing:1px}
.hudTop{display:flex;gap:8px;align-items:center;padding:6px 9px;border:1px solid #ffffff24;background:#05080dcc;border-radius:7px;backdrop-filter:blur(8px)}
.liveDot{width:7px;height:7px;border-radius:50%;background:#ff3048;box-shadow:0 0 10px #ff3048;animation:livePulse 1.1s infinite}
@keyframes livePulse{50%{opacity:.35;transform:scale(.75)}}
.hudBtns{display:flex;gap:5px}.hudBtns button{border:1px solid #ffffff22;background:#05080dcc;color:#fff;border-radius:6px;padding:6px 8px;font-size:8px;letter-spacing:.7px;cursor:pointer}
.hudBtns button:hover{background:#ffffff18}
@media(max-width:700px){#proHUD{top:38px;right:8px}.hudBtns button{padding:5px 6px}.hudTop{padding:5px 7px}}
#matchMenu,#pauseMenu{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#163c25cc,#020603ee 70%);backdrop-filter:blur(7px)}
.menuCard,.pauseCard{width:min(430px,calc(100vw - 32px));padding:32px;border:1px solid #ffffff22;border-radius:18px;background:#07100de8;box-shadow:0 25px 80px #000b;text-align:center}
.brand{font-size:58px;font-weight:1000;letter-spacing:-4px;font-style:italic}.brand span{color:#ff3048}.menuSub{font-size:9px;letter-spacing:4px;opacity:.55;margin:4px 0 30px}
.menuCard button,.pauseCard button{width:100%;padding:13px;margin:6px 0;border:1px solid #ffffff22;border-radius:9px;background:#ffffff0d;color:white;font-weight:900;letter-spacing:1.5px;cursor:pointer}.menuCard .primary{background:#c91f31;border-color:#ff5160;box-shadow:0 8px 25px #c91f3140}
.menuRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.menuRow label{text-align:left;font-size:8px;letter-spacing:1px;opacity:.7}.menuRow select{display:block;width:100%;margin-top:5px;padding:9px;background:#101914;color:#fff;border:1px solid #ffffff1f;border-radius:7px}
.tips{margin-top:18px;font-size:9px;opacity:.4}.pauseCard{width:300px}.pauseTitle{font-size:22px;font-weight:900;margin-bottom:14px}
#pauseMenu{display:none;background:#020603aa}#pauseMenu.open{display:grid}
@media(max-width:700px){.brand{font-size:48px}.menuCard{padding:25px}}
</style>
</head>
<body>
<div id="hud">
 <div class="score"><span class="team home">HOME</span><b id="score">0 — 0</b><span class="team away">AWAY</span><small id="clock">00:00</small></div>
 <div id="status">READY • WASD / ARROWS</div><div id="timed" class="timed">TIMED FINISH</div><div class="bar"><i id="powerFill"></i></div>
 <div class="help">WASD / ARROWS Move · SHIFT Sprint · E Pass · SPACE Shoot · Q Switch · R Reset · C Camera</div><div id="cameraLabel">TELE-BROADCAST</div>
 <div id="proHUD" aria-label="Match controls">
   <div class="hudTop">
     <span class="liveDot"></span><span>LIVE MATCH</span>
     <span id="fps">60 FPS</span>
   </div>
   <div class="hudBtns">
     <button id="fsBtn">FULLSCREEN</button>
     <button id="qualityBtn">QUALITY: HIGH</button>
   </div>
 </div>
</div>
<div id="touch">
 <button class="touchBtn" data-key="w">▲</button><button class="touchBtn" data-key="shift">SPRINT</button>
 <button class="touchBtn" data-key="a">◀</button><button class="touchBtn" data-key="d">▶</button>
 <button class="touchBtn" data-key="s">▼</button><button class="touchBtn" data-action="pass">PASS E</button>
 <button class="touchBtn wide" data-action="shoot">SHOOT SPACE</button><button class="touchBtn" data-action="switch">SWITCH Q</button><button class="touchBtn" data-action="camera">CAM C</button>
</div>
<div id="matchMenu">
  <div class="menuCard">
    <div class="brand">FIFA <span>19</span></div>
    <div class="menuSub">WEB FOOTBALL EXPERIENCE</div>
    <button id="playBtn" class="primary">KICK OFF</button>
    <div class="menuRow">
      <label>DIFFICULTY<select id="difficulty"><option>AMATEUR</option><option selected>PROFESSIONAL</option><option>WORLD CLASS</option></select></label>
      <label>MATCH<select id="matchLength"><option value="180">3 MIN</option><option value="300" selected>5 MIN</option><option value="600">10 MIN</option></select></label>
    </div>
    <div class="tips">WASD / ARROWS Move · SHIFT Sprint · E Pass · SPACE Shoot</div>
  </div>
</div>
<div id="pauseMenu"><div class="pauseCard"><div class="pauseTitle">MATCH PAUSED</div><button id="resumeBtn">RESUME</button><button id="restartBtn">RESTART</button></div></div><canvas id="game"></canvas>
<script type="module" src="./game.js"></script>
<script>
(()=>{const fps=document.getElementById('fps'),fs=document.getElementById('fsBtn'),q=document.getElementById('qualityBtn');
let frames=0,last=performance.now(),high=true;
function tick(t){frames++;if(t-last>=1000){fps.textContent=frames+' FPS';frames=0;last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);
fs.onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
q.onclick=()=>{high=!high;q.textContent='QUALITY: '+(high?'HIGH':'PERFORMANCE');document.querySelectorAll('canvas').forEach(x=>x.style.imageRendering=high?'auto':'auto');};
})();
</script><script>
(()=>{const menu=document.getElementById('matchMenu'),pause=document.getElementById('pauseMenu');
const play=document.getElementById('playBtn'),resume=document.getElementById('resumeBtn'),restart=document.getElementById('restartBtn');
let paused=false;
play.onclick=()=>{menu.style.display='none';document.body.focus()};
resume.onclick=()=>{paused=false;pause.classList.remove('open')};
restart.onclick=()=>{location.reload()};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.style.display==='none'){paused=!paused;pause.classList.toggle('open',paused)}});
window.__fifaSettings={get difficulty(){return document.getElementById('difficulty').value},get matchLength(){return +document.getElementById('matchLength').value}};
})();
</script></body>
</html>
