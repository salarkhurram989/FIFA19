<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FIFA19 — 3D Football Simulation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100a;font-family:Arial,sans-serif;color:#fff}body{touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;text-shadow:0 2px 4px #000}.score{position:absolute;top:14px;left:50%;transform:translateX(-50%);min-width:310px;padding:7px 18px;background:#070b0dcc;border:1px solid #ffffff30;border-radius:4px;text-align:center}.score b{font-size:23px;margin:0 15px}.score small{display:block;color:#ddd;margin-top:2px}.home{color:#ef3140}.away{color:#e9eef6}.team{font-weight:800}#status{position:absolute;top:15px;left:15px;padding:8px 11px;background:#0009;border-radius:4px;font-size:12px}.help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#0009;padding:7px 12px;border-radius:4px;font-size:11px;white-space:nowrap}.bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:240px;height:8px;background:#000b;border:1px solid #fff4;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff}.timed{position:absolute;top:91px;left:50%;transform:translateX(-50%) scale(.8);font-size:20px;font-weight:900;opacity:0;transition:.1s}.timed.show{opacity:1;transform:translateX(-50%) scale(1)}#cameraLabel{position:absolute;right:15px;top:15px;font-size:10px;opacity:.8}#touch{position:fixed;right:14px;bottom:45px;z-index:10;display:grid;grid-template-columns:repeat(2,65px);gap:7px;pointer-events:auto}.touchBtn{height:46px;border:1px solid #fff4;border-radius:9px;background:#05080dcc;color:#fff;font-weight:800;touch-action:none}.touchBtn.wide{grid-column:span 2}@media(min-width:701px){#touch{opacity:.35}}@media(max-width:700px){.help{display:none}#status{display:none}.score{top:6px}.bar{bottom:9px}}
</style>
</head>
<body>
<div id="hud">
 <div class="score"><span class="team home">HOME</span><b id="score">0 — 0</b><span class="team away">AWAY</span><small id="clock">00:00</small></div>
 <div id="status">READY • WASD / ARROWS</div><div id="timed" class="timed">TIMED FINISH</div><div class="bar"><i id="powerFill"></i></div>
 <div class="help">WASD / ARROWS Move · SHIFT Sprint · E Pass · SPACE Shoot · Q Switch · R Reset · C Camera</div><div id="cameraLabel">TELE-BROADCAST</div>
</div>
<div id="touch">
 <button class="touchBtn" data-key="w">▲</button><button class="touchBtn" data-key="shift">SPRINT</button>
 <button class="touchBtn" data-key="a">◀</button><button class="touchBtn" data-key="d">▶</button>
 <button class="touchBtn" data-key="s">▼</button><button class="touchBtn" data-action="pass">PASS E</button>
 <button class="touchBtn wide" data-action="shoot">SHOOT SPACE</button><button class="touchBtn" data-action="switch">SWITCH Q</button><button class="touchBtn" data-action="camera">CAM C</button>
</div>
<canvas id="game"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07110c);scene.fog=new THREE.Fog(0x07110c,75,185);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,320);
scene.add(new THREE.HemisphereLight(0xddeaff,0x142018,1.35));
const sun=new THREE.DirectionalLight(0xffffff,3.4);sun.position.set(-35,58,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;sun.shadow.camera.near=1;sun.shadow.camera.far=190;sun.shadow.bias=-.00035;scene.add(sun);
const fill=new THREE.DirectionalLight(0x9abaff,.55);fill.position.set(35,28,-35);scene.add(fill);

const F={L:105,W:68,HL:52.5,HW:34,GW:7.32,GD:3.5};const BALL=.11,PR=.42,HOME=0,AWAY=1;
const clamp=THREE.MathUtils.clamp;
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

// ---------------- PITCH ----------------
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(F.L,F.W),mat(0x2b7437,.91));pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;scene.add(pitch);
for(let i=0;i<14;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(F.L/14+.025,F.W),mat(i%2?0x317d3d:0x286f35,.94));s.rotation.x=-Math.PI/2;s.position.set(-F.HL+F.L/28+i*F.L/14,.006,0);s.receiveShadow=true;scene.add(s)}
const lineMat=new THREE.LineBasicMaterial({color:0xffffff});
function line(a,b,c,d){scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a,.027,b),new THREE.Vector3(c,.027,d)]),lineMat))}
function loop(points){points=[...points,points[0]];scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.028,p[1]))),lineMat))}
line(-F.HL,-F.HW,F.HL,-F.HW);line(-F.HL,F.HW,F.HL,F.HW);line(-F.HL,-F.HW,-F.HL,F.HW);line(F.HL,-F.HW,F.HL,F.HW);line(0,-F.HW,0,F.HW);
loop(Array.from({length:97},(_,i)=>[Math.cos(i*Math.PI*2/96)*9.15,Math.sin(i*Math.PI*2/96)*9.15]));
for(const s of [-1,1]){const gx=s*F.HL,bx=s*(F.HL-16.5),sx=s*(F.HL-5.5);line(gx,-20.16,bx,-20.16);line(bx,-20.16,bx,20.16);line(bx,20.16,gx,20.16);line(gx,-9.16,sx,-9.16);line(sx,-9.16,sx,9.16);line(sx,9.16,gx,9.16)}
function goal(side){const g=new THREE.Group(),pm=mat(0xf5f5f5,.28,.05);for(const z of [-F.GW/2,F.GW/2]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,2.44,12),pm);p.position.set(side*F.HL,1.22,z);p.castShadow=true;g.add(p)}const bar=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,F.GW,12),pm);bar.rotation.x=Math.PI/2;bar.position.set(side*F.HL,2.44,0);bar.castShadow=true;g.add(bar);const n=new THREE.Mesh(new THREE.BoxGeometry(F.GD,.01,F.GW),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.24}));n.position.set(side*(F.HL-F.GD/2),1.22,0);g.add(n);scene.add(g)}
goal(-1);goal(1);

// ---------------- STADIUM ----------------
const standMat=mat(0x252b2f,.92),crowdMat=mat(0x465057,1);
for(const z of [-45,45]){const s=new THREE.Mesh(new THREE.BoxGeometry(132,9,16),standMat);s.position.set(0,4.5,z);s.castShadow=true;scene.add(s);const c=new THREE.Mesh(new THREE.BoxGeometry(126,6,12),crowdMat);c.position.set(0,10,z);scene.add(c)}
for(const x of [-61,61]){const s=new THREE.Mesh(new THREE.BoxGeometry(16,9,92),standMat);s.position.set(x,4.5,0);s.castShadow=true;scene.add(s)}
for(let x=-52;x<=52;x+=13)for(const z of [-45,45]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,18,10),mat(0x555b60));p.position.set(x,9,z);scene.add(p);const l=new THREE.Mesh(new THREE.BoxGeometry(5,.8,1),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:2.2}));l.position.set(x,17.8,z);scene.add(l)}

// ---------------- PLAYERS ----------------
const players=[];let controlled=null;
const formations={home:[[-47,0],[-30,-22],[-30,0],[-30,22],[-10,-27],[-10,-9],[-10,9],[-10,27],[14,-18],[14,0],[14,18]],away:[[47,0],[30,-22],[30,0],[30,22],[10,-27],[10,-9],[10,9],[10,27],[-14,-18],[-14,0],[-14,18]]};
function makePlayer(team,x,z,num){
 const g=new THREE.Group();g.position.set(x,.9,z);
 const u={team,num,base:new THREE.Vector3(x,.9,z),vel:new THREE.Vector3(),radius:PR,role:num===1?'GK':'OUT',control:team===HOME?82:76,stamina:100,stun:0,tackleCooldown:0,markTarget:null};g.userData=u;
 const kit=team===HOME?0xc91f31:0xe9edf4,shorts=team===HOME?0x15181d:0x1f2c43;
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.76,5,12),mat(kit,.61));body.castShadow=true;g.add(body);
 const sh=new THREE.Mesh(new THREE.CylinderGeometry(.34,.39,.28,12),mat(shorts,.72));sh.position.y=-.55;sh.castShadow=true;g.add(sh);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),mat(team===HOME?0xc47b5d:0xb87355,.7));head.position.y=.7;head.castShadow=true;g.add(head);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.50,.61,28),new THREE.MeshBasicMaterial({color:team===HOME?0xff3344:0x45a4ff,side:THREE.DoubleSide,transparent:true,opacity:.75}));ring.rotation.x=-Math.PI/2;ring.position.y=-.88;g.add(ring);u.ring=ring;
 const marker=new THREE.Mesh(new THREE.ConeGeometry(.14,.28,4),new THREE.MeshBasicMaterial({color:0xffff00}));marker.position.y=2.2;marker.rotation.x=Math.PI;marker.visible=false;g.add(marker);u.marker=marker;
 scene.add(g);players.push(g);return g}
formations.home.forEach((p,i)=>makePlayer(HOME,p[0],p[1],i+1));formations.away.forEach((p,i)=>makePlayer(AWAY,p[0],p[1],i+1));
controlled=players.find(p=>p.userData.team===HOME&&p.userData.num===10)||players[9];controlled.userData.marker.visible=true;

// ---------------- BALL VISUAL ----------------
function makeBallTexture(){
 const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');x.fillStyle='#f1f1eb';x.fillRect(0,0,1024,1024);
 // fine leather grain
 for(let i=0;i<42000;i++){const px=Math.random()*1024,py=Math.random()*1024,v=205+Math.random()*45;x.fillStyle=`rgba(${v},${v},${v-4},${.05+Math.random()*.08})`;x.fillRect(px,py,1,1)}
 // repeated black pentagonal panel motifs
 const panels=[[150,180],[390,130],[680,180],[850,390],[660,520],[350,500],[160,690],[470,820],[790,760],[520,300]];
 for(const p of panels){x.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,r=64;x.lineTo(p[0]+Math.cos(a)*r,p[1]+Math.sin(a)*r)}x.closePath();x.fillStyle='#121416';x.fill();x.strokeStyle='#62666a';x.lineWidth=4;x.stroke()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const ballMat=new THREE.MeshPhysicalMaterial({map:makeBallTexture(),roughness:.43,metalness:0,clearcoat:.06,clearcoatRoughness:.28});
const ball=new THREE.Mesh(new THREE.SphereGeometry(BALL,64,40),ballMat);ball.castShadow=true;ball.receiveShadow=true;ball.position.set(0,BALL,0);scene.add(ball);
const ballState={v:new THREE.Vector3(),w:new THREE.Vector3(),mass:.43,Cd:.25,restitution:.75,angularDrag:.05,magnus:.00035,lastKick:0,owner:null};

// ---------------- INPUT ----------------
const keys=Object.create(null),pressed=Object.create(null);
const blockedKeys=new Set([' ','Spacebar','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Shift','w','a','s','d','e','q','r','c','W','A','S','D','E','Q','R','C']);
function keyName(e){if(e.code==='Space'||e.key===' ')return 'space';if(e.key==='Shift'||e.code==='ShiftLeft'||e.code==='ShiftRight')return 'shift';return e.key.length===1?e.key.toLowerCase():e.key}
window.addEventListener('keydown',e=>{if(blockedKeys.has(e.key)||blockedKeys.has(e.code))e.preventDefault();const k=keyName(e);if(!keys[k])pressed[k]=true;keys[k]=true},{capture:true,passive:false});
window.addEventListener('keyup',e=>{if(blockedKeys.has(e.key)||blockedKeys.has(e.code))e.preventDefault();keys[keyName(e)]=false},{capture:true,passive:false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in pressed)delete pressed[k]});
function consume(k){const v=!!pressed[k];delete pressed[k];return v}

let cameraMode=0,score=[0,0],matchSeconds=0,shootCharge=0,shooting=false,goalCooldown=0,clearCooldown=0,last=performance.now();
const scoreEl=document.getElementById('score'),clockEl=document.getElementById('clock'),statusEl=document.getElementById('status'),powerEl=document.getElementById('powerFill'),timedEl=document.getElementById('timed'),cameraLabel=document.getElementById('cameraLabel');
function status(s){statusEl.textContent=s}
function resetBall(){ball.position.set(0,BALL,0);ballState.v.set(0,0,0);ballState.w.set(0,0,0);ballState.owner=null;shootCharge=0;shooting=false;goalCooldown=.7;status('BALL RESET')}
function switchPlayer(){const mates=players.filter(p=>p.userData.team===HOME&&p!==controlled);let best=mates[0],bd=Infinity;for(const p of mates){const d=p.position.distanceTo(ball.position)+p.position.distanceTo(controlled.position)*.08;if(d<bd){bd=d;best=p}}controlled.userData.marker.visible=false;controlled=best;controlled.userData.marker.visible=true;status('PLAYER SWITCHED')}
function inputDir(){const x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const v=new THREE.Vector3(x,0,z);return v.lengthSq()?v.normalize():v}
function nearestTeammate(){let best=null,bd=Infinity;for(const p of players)if(p.userData.team===HOME&&p!==controlled){const d=p.position.distanceTo(controlled.position);if(d<bd){bd=d;best=p}}return best}
function kick(power,loft,spin,target){const dir=target.clone().sub(ball.position);dir.y=0;if(dir.lengthSq()<.01){dir.set(1,0,0)}dir.normalize();ballState.v.copy(dir).multiplyScalar(power);ballState.v.y=power*loft;ballState.w.set(0,spin*power,0);ballState.owner=null;ballState.lastKick=performance.now()}
function pass(){if(controlled.position.distanceTo(ball.position)>1.5)return;const mate=nearestTeammate();const target=mate?mate.position.clone().addScaledVector(mate.userData.vel,.25):controlled.position.clone().add(new THREE.Vector3(10,0,0));kick(20,.035,.45,target);status('DRIVEN PASS')}
function shoot(){if(controlled.position.distanceTo(ball.position)>1.5)return;const error=Math.abs(shootCharge-.72),quality=error<.09?'GREEN':error<.22?'YELLOW':'RED',power=17+26*shootCharge;const target=new THREE.Vector3(F.HL+3,1.15,clamp(controlled.position.z*.45,-5.5,5.5));kick(power,.16,quality==='GREEN'?2.1:quality==='YELLOW'?1.3:.72,target);timedEl.textContent=quality+' FINISH';timedEl.classList.add('show');setTimeout(()=>timedEl.classList.remove('show'),430);status(quality+' FINISH');shootCharge=0;shooting=false}

// ---------------- MOVEMENT / COLLISION ----------------
function movePlayer(p,desired,dt){const u=p.userData;if(u.stun>0){u.stun-=dt;u.vel.multiplyScalar(Math.exp(-9*dt));p.position.addScaledVector(u.vel,dt);return}const a=1-Math.exp(-7*dt);u.vel.lerp(desired,a);p.position.addScaledVector(u.vel,dt);p.position.x=clamp(p.position.x,-F.HL+.75,F.HL-.75);p.position.z=clamp(p.position.z,-F.HW+.75,F.HW-.75);if(u.vel.lengthSq()>.08)p.rotation.y=Math.atan2(u.vel.x,u.vel.z)}
function controlledUpdate(dt){const d=inputDir(),sprint=!!keys.shift&&d.lengthSq();movePlayer(controlled,d.clone().multiplyScalar(sprint?9.5:6.25),dt);if(consume('q'))switchPlayer();if(consume('r'))resetBall();if(consume('c')){cameraMode=(cameraMode+1)%3;cameraLabel.textContent=['TELE-BROADCAST','OVERHEAD','FOLLOW CAMERA'][cameraMode]}if(consume('e'))pass();if(keys.space){shooting=true;shootCharge=Math.min(1,shootCharge+dt*1.15)}else if(shooting)shoot();powerEl.style.width=(shootCharge*100)+'%';
 const dist=controlled.position.distanceTo(ball.position);if(dist<1.25&&!keys.space&&ballState.v.length()<4){const to=ball.position.clone().sub(controlled.position);to.y=0;if(to.lengthSq()>.01){to.normalize();ball.position.x=controlled.position.x+to.x*1.03;ball.position.z=controlled.position.z+to.z*1.03}ballState.v.x=controlled.userData.vel.x*.82;ballState.v.z=controlled.userData.vel.z*.82;ballState.owner=controlled}}

function separatePlayers(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j],d=a.position.clone().sub(b.position);d.y=0;const len=d.length(),min=.82;if(len>0&&len<min){d.multiplyScalar((min-len)/len*.5);a.position.add(d);b.position.sub(d);a.userData.vel.multiplyScalar(.82);b.userData.vel.multiplyScalar(.82)}}}
function ballPlayerCollision(){for(const p of players){const d=ball.position.clone().sub(p.position);d.y=0;const len=d.length(),min=BALL+PR;if(len>0&&len<min){d.multiplyScalar(1/len);ball.position.x=p.position.x+d.x*min;ball.position.z=p.position.z+d.z*min;if(p===controlled&&!keys.space&&ballState.v.length()<5){ballState.v.x=p.userData.vel.x*.9;ballState.v.z=p.userData.vel.z*.9;ballState.owner=p}}}}

// ---------------- OPPONENT DEFENSIVE AI ----------------
function homeThreats(){return players.filter(p=>p.userData.team===HOME)}
function nearestHomeThreat(ai){let best=controlled,bd=Infinity;for(const p of homeThreats()){const d=p.position.distanceTo(ai.position);if(d<bd){bd=d;best=p}}return best}
function predictBall(t){return ball.position.clone().addScaledVector(ballState.v,t)}
function defensiveLineTarget(ai){const u=ai.userData;const base=u.base.clone();const ballInfluence=clamp((ball.position.x+5)/58,-1,1);base.x += ballInfluence*9;const lateral=clamp(ball.position.z/34,-1,1);base.z += lateral*(u.num===1?5:7);return base}
function passingLaneTarget(ai,threat){const lane=ball.position.clone().sub(threat.position);lane.y=0;if(lane.lengthSq()<.01)lane.set(1,0,0);lane.normalize();return threat.position.clone().addScaledVector(lane,1.8)}
function tackleAI(ai,dt){const u=ai.userData;if(u.tackleCooldown>0)return;const carrier=nearestHomeThreat(ai);const d=ai.position.distanceTo(carrier.position),bd=ai.position.distanceTo(ball.position);if(d<=1.2&&bd<=1.5&&performance.now()-ballState.lastKick>350){u.tackleCooldown=0.9;const success=.46+u.control/360+(.12*(u.stamina/100));if(Math.random()<success){const push=ball.position.clone().sub(ai.position);push.y=0;if(push.lengthSq()<.01)push.set(-1,0,0);push.normalize();ballState.v.copy(push).multiplyScalar(7.8);ballState.v.y=1.25;ballState.w.set(0,(Math.random()-.5)*3.2,0);ballState.owner=ai;carrier.userData.stun=.34;status('AI TACKLE — BALL WON')}}}
function interceptAI(ai){const speed=ballState.v.length();if(speed<6)return null;const dist=ai.position.distanceTo(ball.position),t=clamp(dist/Math.max(speed,1),.15,1.15),pred=predictBall(t);if(pred.x<35||pred.x>51||Math.abs(pred.z)>33)return null;return pred}
function clearance(ai){const target=new THREE.Vector3(-5+(Math.random()*10),0,(Math.random()-.5)*18);const d=target.sub(ball.position);d.y=0;d.normalize();ballState.v.copy(d).multiplyScalar(21);ballState.v.y=3.2;ballState.w.set(0,(Math.random()-.5)*5,0);ballState.owner=null;ballState.lastKick=performance.now();clearCooldown=.8;status('AI CLEARANCE')}
function updateDefenseAI(dt){
 const away=players.filter(p=>p.userData.team===AWAY),defThird=ball.position.x>17,box=ball.position.x>36&&Math.abs(ball.position.z)<20;
 let presser=null,pd=Infinity;for(const p of away){if(p.userData.role==='GK')continue;const d=p.position.distanceTo(controlled.position);if(d<pd){pd=d;presser=p}}
 for(const p of away){const u=p.userData;u.tackleCooldown=Math.max(0,u.tackleCooldown-dt);let threat=nearestHomeThreat(p),target=defensiveLineTarget(p),distThreat=p.position.distanceTo(threat.position);
   if(p===presser&&defThird){target=threat.position.clone();target.y=.9;if(distThreat<6)target.lerp(ball.position,.45);u.markTarget=threat}
   else if(distThreat<11){target=passingLaneTarget(p,threat);u.markTarget=threat}
   else{u.markTarget=null}
   const intercept=interceptAI(p);if(intercept)target.lerp(intercept,.72);
   if(u.role==='GK'){target.x=48.2;target.z=clamp(ball.position.z*.38,-10.5,10.5);if(box&&ball.position.x>44)target.lerp(ball.position,.55)}
   const delta=target.sub(p.position);delta.y=0;const speed=p===presser&&defThird?8.5:(u.role==='GK'?5.8:6.25);const desired=delta.length()>.45?delta.normalize().multiplyScalar(speed):new THREE.Vector3();movePlayer(p,desired,dt);tackleAI(p,dt);
 }
 // If the ball enters the defensive box, the keeper/nearest defender can clear downfield.
 if(box&&clearCooldown<=0&&ball.position.y<1.9&&ballState.v.x>0){const candidates=away.filter(p=>p.position.distanceTo(ball.position)<7);if(candidates.length)clearance(candidates[0])}
 clearCooldown=Math.max(0,clearCooldown-dt);
}

// ---------------- BALL PHYSICS ----------------
function ballPhysics(dt){
 const v=ballState.v,s=v.length();
 if(s>.001){const rho=.9,A=Math.PI*BALL*BALL;const drag=.5*rho*ballState.Cd*A*s;v.addScaledVector(v.clone().normalize(),-drag/ballState.mass*dt)}
 const magnus=new THREE.Vector3().crossVectors(ballState.w,v).multiplyScalar(ballState.magnus);v.addScaledVector(magnus,dt);
 v.y-=9.81*dt;ball.position.addScaledVector(v,dt);ballState.w.multiplyScalar(Math.exp(-ballState.angularDrag*dt));
 if(ball.position.y<=BALL){ball.position.y=BALL;if(v.y<0)v.y=-v.y*ballState.restitution;const friction=clamp(.58-s*.006,.25,.9);v.x*=Math.max(0,1-friction*dt*4);v.z*=Math.max(0,1-friction*dt*4);ballState.w.multiplyScalar(.985);if(Math.abs(v.y)<.3)v.y=0}
 // pitch boundaries with elastic response; leave goal mouth open for goal detection
 if(Math.abs(ball.position.z)>F.HW-BALL){ball.position.z=Math.sign(ball.position.z)*(F.HW-BALL);v.z*=-.62}
 if(Math.abs(ball.position.x)>F.HL+F.GD){ball.position.x=Math.sign(ball.position.x)*(F.HL+F.GD);v.x*=-.55}
 // stop micro-drift
 if(v.length()<.035&&ball.position.y<=BALL+.002)v.set(0,0,0);
 ball.rotation.x+=ballState.w.x*dt;ball.rotation.y+=ballState.w.y*dt;ball.rotation.z+=ballState.w.z*dt;
 // visually reinforce speed/spin with subtle roughness variation
 ballMat.roughness=clamp(.43-ballState.w.length()*.002,.28,.48);
}
function goalCheck(){if(goalCooldown>0)return;if(Math.abs(ball.position.x)>F.HL-.2&&Math.abs(ball.position.z)<F.GW/2&&ball.position.y<2.44){const homeScored=ball.position.x>0;score[homeScored?HOME:AWAY]++;scoreEl.textContent=score[HOME]+' — '+score[AWAY];status(homeScored?'GOAL — HOME':'GOAL — AWAY');goalCooldown=1.2;setTimeout(resetBall,650)}}

// ---------------- CAMERA / PRESENTATION ----------------
function updateCamera(dt){const look=ball.position.clone();let target;if(cameraMode===0)target=new THREE.Vector3(ball.position.x-31,25,ball.position.z+38);else if(cameraMode===1)target=new THREE.Vector3(0,61,0);else target=controlled.position.clone().add(new THREE.Vector3(0,6.3,9));camera.position.lerp(target,1-Math.exp(-4*dt));camera.lookAt(look.x,0,look.z)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);

// ---------------- TOUCH ----------------
document.querySelectorAll('.touchBtn').forEach(b=>{const key=b.dataset.key,action=b.dataset.action;const down=e=>{e.preventDefault();if(key)keys[key]=true;else if(action==='pass')pressed.e=true;else if(action==='switch')pressed.q=true;else if(action==='camera')pressed.c=true;else if(action==='shoot')keys.space=true};const up=e=>{e.preventDefault();if(key)keys[key]=false;if(action==='shoot')keys.space=false};b.addEventListener('pointerdown',down,{passive:false});b.addEventListener('pointerup',up,{passive:false});b.addEventListener('pointercancel',up,{passive:false});b.addEventListener('pointerleave',up,{passive:false})});

// ---------------- MAIN LOOP ----------------
function frame(now){const dt=Math.min(.033,Math.max(.001,(now-last)/1000));last=now;matchSeconds+=dt;controlledUpdate(dt);updateDefenseAI(dt);separatePlayers();ballPlayerCollision();ballPhysics(dt);goalCheck();updateCamera(dt);const sec=Math.floor(matchSeconds);clockEl.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
