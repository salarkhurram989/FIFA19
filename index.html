<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FIFA19 — 3D Football Simulation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110b;font-family:Arial,Helvetica,sans-serif;color:#fff}body{touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 2px 4px #000}.score{position:absolute;top:18px;left:50%;transform:translateX(-50%);min-width:280px;padding:9px 18px;background:rgba(8,10,15,.78);border:1px solid rgba(255,255,255,.2);border-radius:4px;text-align:center;font-size:14px}.score b{font-size:22px;margin:0 16px}.score small{display:block;margin-top:3px;font-size:15px;color:#ddd}.team{font-weight:700}.home{color:#e31b23}.away{color:#e9edf4}
#status{position:absolute;left:20px;top:20px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:4px;font-size:12px;letter-spacing:.5px}.bar{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:220px;height:8px;border-radius:8px;background:rgba(0,0,0,.65);overflow:hidden;border:1px solid rgba(255,255,255,.35)}#powerFill{display:block;width:0;height:100%;background:#fff;transition:none}.help{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:3px;white-space:nowrap}.timed{position:absolute;top:105px;left:50%;transform:translateX(-50%) scale(.9);font-size:18px;font-weight:800;opacity:0;transition:.15s}.timed.show{opacity:1;transform:translateX(-50%) scale(1)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#07110b;z-index:20;font-weight:700;letter-spacing:2px}.hidden{display:none!important}
#touch{position:fixed;right:18px;bottom:70px;z-index:10;display:grid;grid-template-columns:repeat(2,62px);gap:9px;pointer-events:auto}.touchBtn{height:52px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(5,8,12,.72);color:#fff;font-weight:800;touch-action:none;user-select:none}.touchBtn:active{background:rgba(255,255,255,.25)}#touch .wide{grid-column:span 2}.smallNote{position:absolute;right:18px;top:18px;font-size:10px;opacity:.65}
@media(max-width:700px){#status{display:none}.help{display:none}.score{top:8px}.smallNote{display:none}}
</style>
</head>
<body>
<div id="loading">LOADING MATCH…</div>
<div id="hud">
  <div class="score"><span class="team home">HOME</span><b id="score">0 — 0</b><span class="team away">AWAY</span><small id="clock">00:00</small></div>
  <div id="status">READY • MOVE WITH WASD / ARROWS</div>
  <div class="timed" id="timed">TIMED FINISH</div>
  <div class="bar"><span id="powerFill"></span></div>
  <div class="help">WASD / ARROWS Move · SHIFT Sprint · E Pass · SPACE Shoot · Q Switch · R Reset · C Camera</div>
  <div class="smallNote" id="cameraLabel">TELE-BROADCAST</div>
</div>
<div id="touch">
  <button class="touchBtn" data-key="w">▲</button><button class="touchBtn" data-key="shift">SPRINT</button>
  <button class="touchBtn" data-key="a">◀</button><button class="touchBtn" data-key="d">▶</button>
  <button class="touchBtn" data-key="s">▼</button><button class="touchBtn" data-action="pass">PASS E</button>
  <button class="touchBtn wide" data-action="shoot">SHOOT SPACE</button>
  <button class="touchBtn" data-action="switch">SWITCH Q</button><button class="touchBtn" data-action="camera">CAM C</button>
</div>
<canvas id="game"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07100c);
scene.fog=new THREE.Fog(0x07100c,75,170);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,300);

const hemi=new THREE.HemisphereLight(0xddeeff,0x172318,1.45);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,3.0);sun.position.set(-30,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;sun.shadow.camera.near=1;sun.shadow.camera.far=180;scene.add(sun);
const fill=new THREE.DirectionalLight(0x9bbcff,.55);fill.position.set(30,25,-35);scene.add(fill);

const FIELD={length:105,width:68,halfL:52.5,halfW:34,goalW:7.32,goalD:3.5};
const BALL_R=.11,PLAYER_R=.40,PLAYER_H=1.8;
const mat=(color,rough=.78,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const white=new THREE.LineBasicMaterial({color:0xffffff});

// Pitch with high-contrast markings and alternating grass.
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(FIELD.length,FIELD.width),mat(0x287238,.92));pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;scene.add(pitch);
for(let i=0;i<14;i++){
  const stripe=new THREE.Mesh(new THREE.PlaneGeometry(FIELD.length/14+.02,FIELD.width),mat(i%2?0x2f7d3c:0x287238,.95));
  stripe.rotation.x=-Math.PI/2;stripe.position.set(-FIELD.halfL+FIELD.length/28+i*FIELD.length/14,.006,0);stripe.receiveShadow=true;scene.add(stripe);
}
function addLine(x1,z1,x2,z2,y=.028){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y,z1),new THREE.Vector3(x2,y,z2)]);const l=new THREE.Line(g,white);scene.add(l);return l}
addLine(-FIELD.halfL,-FIELD.halfW,FIELD.halfL,-FIELD.halfW);addLine(-FIELD.halfL,FIELD.halfW,FIELD.halfL,FIELD.halfW);addLine(-FIELD.halfL,-FIELD.halfW,-FIELD.halfL,FIELD.halfW);addLine(FIELD.halfL,-FIELD.halfW,FIELD.halfL,FIELD.halfW);addLine(0,-FIELD.halfW,0,FIELD.halfW);
function loopLine(points){const pts=points.map(p=>new THREE.Vector3(p[0],.03,p[1]));pts.push(pts[0].clone());scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),white))}
loopLine(Array.from({length:65},(_,i)=>[Math.cos(i*Math.PI*2/64)*9.15,Math.sin(i*Math.PI*2/64)*9.15]));
for(const s of [-1,1]){
 const gx=s*FIELD.halfL, bx=s*(FIELD.halfL-16.5);
 addLine(gx,-20.16,bx,-20.16);addLine(bx,-20.16,bx,20.16);addLine(bx,20.16,gx,20.16);
 const sx=s*(FIELD.halfL-5.5);addLine(gx,-9.16,sx,-9.16);addLine(sx,-9.16,sx,9.16);addLine(sx,9.16,gx,9.16);
}
// Goals.
function createGoal(side){const x=side*FIELD.halfL;const postsMat=mat(0xf2f2f2,.45);const g=new THREE.Group();for(const z of [-FIELD.goalW/2,FIELD.goalW/2]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,2.44,12),postsMat);p.position.set(x,1.22,z);p.castShadow=true;g.add(p)}const cross=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,FIELD.goalW,12),postsMat);cross.rotation.x=Math.PI/2;cross.position.set(x,2.44,0);g.add(cross);const net=new THREE.Mesh(new THREE.BoxGeometry(FIELD.goalD,.01,FIELD.goalW),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.28}));net.position.set(x-side*FIELD.goalD/2,1.22,0);g.add(net);scene.add(g)}
createGoal(-1);createGoal(1);

// Simple stadium shell / floodlight towers.
const standMat=mat(0x252a2d,.9);for(const z of [-45,45]){const s=new THREE.Mesh(new THREE.BoxGeometry(132,9,16),standMat);s.position.set(0,4.5,z);s.castShadow=true;scene.add(s)}for(const x of [-61,61]){const s=new THREE.Mesh(new THREE.BoxGeometry(16,9,90),standMat);s.position.set(x,4.5,0);s.castShadow=true;scene.add(s)}
for(let x=-52;x<=52;x+=13)for(const z of [-45,45]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,18,10),mat(0x555b60));pole.position.set(x,9,z);pole.castShadow=true;scene.add(pole);const lamp=new THREE.Mesh(new THREE.BoxGeometry(5,.8,1),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:2}));lamp.position.set(x,17.8,z);scene.add(lamp)}

const players=[];let controlled=null;
const HOME=0,AWAY=1;
const formations={
 home:[[-47,0],[-30,-22],[-30,0],[-30,22],[-10,-27],[-10,-9],[-10,9],[-10,27],[14,-18],[14,0],[14,18]],
 away:[[47,0],[30,-22],[30,0],[30,22],[10,-27],[10,-9],[10,9],[10,27],[-14,-18],[-14,0],[-14,18]]
};
function makePlayer(team,x,z,num){const group=new THREE.Group();group.position.set(x,.9,z);group.userData={team,num,vel:new THREE.Vector3(),control:team===HOME?78:72,stamina:100,radius:PLAYER_R,base:new THREE.Vector3(x,.9,z),role:num===1?'GK':'OUT',targetYaw:team===HOME?Math.PI/2:-Math.PI/2};
 const kit=team===HOME?0xc7192b:0xe8edf5;const shorts=team===HOME?0x15171c:0x1c2738;const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.76,5,12),mat(kit,.7));body.castShadow=true;group.add(body);const short=new THREE.Mesh(new THREE.CylinderGeometry(.34,.39,.28,12),mat(shorts,.8));short.position.y=-.55;short.castShadow=true;group.add(short);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),mat(0xc88963,.75));head.position.y=.7;head.castShadow=true;group.add(head);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.52,.62,24),new THREE.MeshBasicMaterial({color:team===HOME?0xff3344:0x55aaff,side:THREE.DoubleSide,transparent:true,opacity:.85}));ring.rotation.x=-Math.PI/2;ring.position.y=-.88;group.add(ring);group.userData.ring=ring;
 const marker=new THREE.Mesh(new THREE.ConeGeometry(.16,.3,4),new THREE.MeshBasicMaterial({color:0xffff00}));marker.position.y=2.25;marker.rotation.x=Math.PI;marker.visible=false;group.add(marker);group.userData.marker=marker;
 scene.add(group);players.push(group);return group}
formations.home.forEach((p,i)=>makePlayer(HOME,p[0],p[1],i+1));formations.away.forEach((p,i)=>makePlayer(AWAY,p[0],p[1],i+1));
controlled=players.find(p=>p.userData.team===HOME&&p.userData.num===10)||players[9];controlled.userData.marker.visible=true;

const ball=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,24,16),mat(0xf7f7f7,.3));ball.castShadow=true;ball.position.set(0,BALL_R,0);scene.add(ball);
const ballState={v:new THREE.Vector3(),w:new THREE.Vector3(),mass:.43,Cd:.25,restitution:.78,angularDrag:.05,magnus:.00035};

// Robust global input state. No focus is required; gameplay owns keyboard events.
const keys=Object.create(null);const pressed=Object.create(null);
const blockedKeys=new Set([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Shift','w','a','s','d','e','q','r','c','W','A','S','D','E','Q','R','C']);
window.addEventListener('keydown',e=>{if(blockedKeys.has(e.key)||blockedKeys.has(e.code))e.preventDefault();const k=normalizeKey(e);if(!keys[k])pressed[k]=true;keys[k]=true},{capture:true,passive:false});
window.addEventListener('keyup',e=>{if(blockedKeys.has(e.key)||blockedKeys.has(e.code))e.preventDefault();keys[normalizeKey(e)]=false},{capture:true,passive:false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in pressed)delete pressed[k]});
function normalizeKey(e){if(e.code==='Space'||e.key===' ')return 'space';if(e.key==='Shift'||e.code==='ShiftLeft'||e.code==='ShiftRight')return 'shift';return e.key.length===1?e.key.toLowerCase():e.key}
function consume(k){const v=!!pressed[k];delete pressed[k];return v}

let cameraMode=0;const cameraNames=['TELE-BROADCAST','OVERHEAD','FOLLOW CAMERA'];let score=[0,0];let matchSeconds=0;const MATCH_LENGTH=90*60;let shootHeld=false,shootCharge=0;let goalLock=0;let statusUntil=0;
const scoreEl=document.getElementById('score'),clockEl=document.getElementById('clock'),statusEl=document.getElementById('status'),powerEl=document.getElementById('powerFill'),timedEl=document.getElementById('timed'),cameraLabel=document.getElementById('cameraLabel');
function setStatus(t,seconds=.8){statusEl.textContent=t;statusUntil=performance.now()+seconds*1000}
function setControlled(p){if(!p||p===controlled)return;controlled.userData.marker.visible=false;controlled=p;controlled.userData.marker.visible=true}
function switchPlayer(){const teammates=players.filter(p=>p.userData.team===controlled.userData.team&&p!==controlled);let best=null,bestScore=Infinity;for(const p of teammates){const d=p.position.distanceTo(ball.position);const score=d+Math.abs(THREE.MathUtils.euclideanModulo(Math.atan2(p.position.x-ball.position.x,p.position.z-ball.position.z)-controlled.rotation.y+Math.PI,Math.PI*2)-Math.PI)*.15;if(score<bestScore){bestScore=score;best=p}}if(best)setControlled(best);setStatus('PLAYER SWITCHED')}
function resetBall(){ball.position.set(0,BALL_R,0);ballState.v.set(0,0,0);ballState.w.set(0,0,0);setStatus('BALL RESET')}
function movementInput(){let x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);let z=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);const v=new THREE.Vector3(x,0,z);if(v.lengthSq()>1)v.normalize();return v}
function forwardOf(p){const f=new THREE.Vector3(0,0,1).applyQuaternion(p.quaternion);f.y=0;return f.normalize()}
function ballDistance(p=controlled){return p.position.distanceTo(ball.position)}
function canKick(){return ballDistance()<=1.5}
function applyKick(power,loft,spin,kind){if(!canKick()){setStatus('TOO FAR FROM BALL');return false}const toBall=new THREE.Vector3().subVectors(ball.position,controlled.position);toBall.y=0;let dir=forwardOf(controlled);if(toBall.lengthSq()>0.01){toBall.normalize();dir.lerp(toBall,.32).normalize()}const impulse=dir.multiplyScalar(power);ballState.v.copy(impulse);ballState.v.y=loft;ballState.w.set(0,spin,0);ball.position.y=Math.max(BALL_R+.015,ball.position.y);setStatus(kind);return true}
function passBall(){if(!canKick())return;const teammates=players.filter(p=>p.userData.team===controlled.userData.team&&p!==controlled);let target=null,best=-Infinity;const f=forwardOf(controlled);for(const p of teammates){const d=p.position.clone().sub(controlled.position);d.y=0;const dist=d.length();if(dist<1||dist>32)continue;const score=d.normalize().dot(f)*2-dist*.025+(p.position.distanceTo(ball.position)<1?-.2:0);if(score>best){best=score;target=p}}if(target){const dir=target.position.clone().sub(ball.position);dir.y=0;const dist=dir.length();dir.normalize();ballState.v.copy(dir.multiplyScalar(16+Math.min(12,dist*.65)));ballState.v.y=.7;ballState.w.set(0,0,0);setStatus('DRIVEN PASS')}else applyKick(20,.7,0,'DRIVEN PASS')}
function shootBall(){const t=shootCharge;const error=Math.abs(t-.72);const quality=error<=.09?'GREEN':error<=.22?'YELLOW':'RED';const power=16+27*Math.min(1,t);const spin=quality==='GREEN'?2.2:quality==='YELLOW'?1.45:.75;const loft=quality==='GREEN'?power*.13:power*.11;if(applyKick(power,loft,spin,quality+' FINISH')){timedEl.textContent=quality+' FINISH';timedEl.classList.add('show');setTimeout(()=>timedEl.classList.remove('show'),550)}shootCharge=0;shootHeld=false}

function updateControlled(dt){const d=movementInput();const sprint=!!keys.shift&&d.lengthSq()>0;const maxSpeed=sprint?10.2:6.8;const target=d.clone().multiplyScalar(maxSpeed);const accel=1-Math.exp(-(sprint?8:6)*dt);controlled.userData.vel.lerp(target,accel);if(d.lengthSq()===0)controlled.userData.vel.multiplyScalar(Math.exp(-8*dt));controlled.position.addScaledVector(controlled.userData.vel,dt);
 controlled.position.x=THREE.MathUtils.clamp(controlled.position.x,-FIELD.halfL+PLAYER_R,FIELD.halfL-PLAYER_R);controlled.position.z=THREE.MathUtils.clamp(controlled.position.z,-FIELD.halfW+PLAYER_R,FIELD.halfW-PLAYER_R);
 if(d.lengthSq()>0.001)controlled.rotation.y=THREE.MathUtils.lerp(controlled.rotation.y,Math.atan2(d.x,d.z),1-Math.exp(-12*dt));
 const dist=ballDistance();
 if(consume('e'))passBall();
 if(consume('q'))switchPlayer();
 if(consume('r'))resetBall();
 if(consume('c'))toggleCamera();
 if(keys.space){shootHeld=true;shootCharge=Math.min(1,shootCharge+dt*1.15)}else if(shootHeld)shootBall();
 powerEl.style.width=(shootCharge*100)+'%';
 // Soft dribble contact: ball remains physical but is gently influenced when very close.
 if(dist<1.05&&!keys.space){const to=ball.position.clone().sub(controlled.position);to.y=0;if(to.length()>0.02){const desired=controlled.position.clone().add(to.normalize().multiplyScalar(1.0));desired.y=BALL_R;ballState.v.lerp(desired.sub(ball.position).multiplyScalar(7),1-Math.exp(-9*dt))}}
}

function updateAI(dt){for(const p of players){if(p===controlled)continue;const team=p.userData.team;let desired=p.userData.base.clone();const towardBall=ball.position.clone().sub(p.position);towardBall.y=0;
 // Shape retention plus ball-side shifting.
 desired.x+=THREE.MathUtils.clamp(ball.position.x*.10,-6,6);desired.z+=THREE.MathUtils.clamp(ball.position.z*.20,-8,8);
 const dist= towardBall.length();
 if(team===AWAY){const attackSpace=ball.position.x<5?ball.position.x+9:14;desired.x=THREE.MathUtils.clamp(desired.x+attackSpace*.16,-47,47)}
 if(team===HOME&&dist<10&&p.userData.num!==1)desired.lerp(ball.position,.18);
 if(team===AWAY&&dist<11&&p.userData.num!==1)desired.lerp(ball.position,.16);
 if(p.userData.role==='GK'){desired.x=team===HOME?-49.8:49.8;desired.z=THREE.MathUtils.clamp(ball.position.z*.35,-12,12)}
 const delta=desired.sub(p.position);delta.y=0;let max=p.userData.role==='GK'?5.8:6.4;if(team===AWAY&&dist<9)max=7.2;
 if(delta.length()>0.4){delta.normalize().multiplyScalar(max);p.userData.vel.lerp(delta,1-Math.exp(-5*dt));p.position.addScaledVector(p.userData.vel,dt);p.rotation.y=THREE.MathUtils.lerp(p.rotation.y,Math.atan2(p.userData.vel.x,p.userData.vel.z),1-Math.exp(-9*dt))}else p.userData.vel.multiplyScalar(Math.exp(-8*dt));
 p.position.x=THREE.MathUtils.clamp(p.position.x,-FIELD.halfL+PLAYER_R,FIELD.halfL-PLAYER_R);p.position.z=THREE.MathUtils.clamp(p.position.z,-FIELD.halfW+PLAYER_R,FIELD.halfW-PLAYER_R);
 if(p.position.distanceTo(ball.position)<1.25&&ballState.v.length()<3.5&&Math.random()<dt*1.8){const dir=team===HOME?new THREE.Vector3(1,0,0):new THREE.Vector3(-1,0,0);ballState.v.copy(dir.multiplyScalar(7));ballState.v.y=.45;ballState.w.set(0,(team===HOME?1:-1)*.4,0)}
 }}

// Capsule-vs-capsule approximation keeps players from clipping through one another.
function resolvePlayers(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j];let dx=b.position.x-a.position.x,dz=b.position.z-a.position.z;let dist=Math.hypot(dx,dz),min=PLAYER_R*2;if(dist===0){dx=.001;dz=0;dist=.001}if(dist<min){const nx=dx/dist,nz=dz/dist,penetration=min-dist;const movableA=a===controlled,movableB=b===controlled;let wa=movableA?1:0,wb=movableB?1:0;if(!movableA&&!movableB){wa=wb=.5}else if(movableA){wa=1;wb=0}else{wa=0;wb=1}a.position.x-=nx*penetration*wa;a.position.z-=nz*penetration*wa;b.position.x+=nx*penetration*wb;b.position.z+=nz*penetration*wb;if(movableA)a.userData.vel.multiplyScalar(.82);if(movableB)b.userData.vel.multiplyScalar(.82)}}}

// Sphere against player capsule: horizontal capsule radius + vertical body interval.
function resolveBallPlayers(){for(const p of players){const dx=ball.position.x-p.position.x,dz=ball.position.z-p.position.z;const h=Math.hypot(dx,dz);const vertical=ball.position.y>=0&&ball.position.y<=1.8;if(h<PLAYER_R+BALL_R&&vertical){const nx=h>0?dx/h:1,nz=h>0?dz/h:0;const penetration=PLAYER_R+BALL_R-h;ball.position.x+=nx*penetration;ball.position.z+=nz*penetration;const rel=ballState.v.clone().sub(p.userData.vel);const vn=rel.x*nx+rel.z*nz;if(vn<0){const impulse=-vn*1.55;ballState.v.x+=nx*impulse;ballState.v.z+=nz*impulse}if(p===controlled&&ballState.v.length()<3)ballState.v.addScaledVector(p.userData.vel,.12)}}}

function ballPhysics(dt){const v=ballState.v;const speed=v.length();if(speed>0.0001){const rho=.9,A=Math.PI*BALL_R*BALL_R;const drag=.5*rho*ballState.Cd*A*speed;v.addScaledVector(v.clone().normalize(),-drag/ballState.mass*dt)}const magnus=new THREE.Vector3().crossVectors(ballState.w,v).multiplyScalar(ballState.magnus);v.addScaledVector(magnus,dt);v.y-=9.81*dt;ball.position.addScaledVector(v,dt);ballState.w.multiplyScalar(Math.exp(-ballState.angularDrag*dt));
 if(ball.position.y<=BALL_R){ball.position.y=BALL_R;if(v.y<0)v.y=-v.y*ballState.restitution;const friction=Math.abs(v.y)<.5?.75:.52;const f=Math.max(0,1-friction*dt);v.x*=f;v.z*=f;ballState.w.multiplyScalar(.985)}
 if(ball.position.x<-FIELD.halfL-3.6||ball.position.x>FIELD.halfL+3.6){if(Math.abs(ball.position.z)>FIELD.goalW/2){ball.position.x=THREE.MathUtils.clamp(ball.position.x,-FIELD.halfL,FIELD.halfL);v.x*=-.68}}
 if(Math.abs(ball.position.z)>FIELD.halfW){ball.position.z=Math.sign(ball.position.z)*FIELD.halfW;v.z*=-.68}
 ball.rotation.x+=ballState.w.x*dt;ball.rotation.y+=ballState.w.y*dt;ball.rotation.z+=ballState.w.z*dt;
 resolveBallPlayers();
}
function goalCheck(){if(goalLock>0)return;const insideGoal=Math.abs(ball.position.z)<FIELD.goalW/2 && ball.position.y<2.44; if(ball.position.x>FIELD.halfL+.12&&insideGoal){score[HOME]++;goalScored('HOME')}else if(ball.position.x<-FIELD.halfL-.12&&insideGoal){score[AWAY]++;goalScored('AWAY')}}
function goalScored(team){goalLock=1.2;scoreEl.textContent=score[0]+' — '+score[1];setStatus((team===HOME?'HOME':'AWAY')+' GOAL!',2);resetBall()}

function toggleCamera(){cameraMode=(cameraMode+1)%3;cameraLabel.textContent=cameraNames[cameraMode];setStatus(cameraNames[cameraMode])}
function updateCamera(dt){const smooth=1-Math.exp(-4.5*dt);let desired,target;
 if(cameraMode===0){desired=new THREE.Vector3(ball.position.x-34,25,ball.position.z+40);target=new THREE.Vector3(ball.position.x,0,ball.position.z);camera.fov=43}
 else if(cameraMode===1){desired=new THREE.Vector3(0,48,0);target=new THREE.Vector3(ball.position.x,0,ball.position.z);camera.fov=48}
 else{const f=forwardOf(controlled);desired=controlled.position.clone().addScaledVector(f,-7);desired.y=4.8;target=controlled.position.clone().addScaledVector(f,7);target.y=1;camera.fov=55}
 camera.position.lerp(desired,smooth);const current=new THREE.Vector3();camera.getWorldDirection(current);const targetDir=target.clone().sub(camera.position).normalize();const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),targetDir);camera.quaternion.slerp(q,smooth);camera.updateProjectionMatrix()}

function updateClock(){const s=Math.min(MATCH_LENGTH,Math.floor(matchSeconds));const mm=Math.floor(s/60),ss=s%60;clockEl.textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function updateTouchControls(){document.querySelectorAll('.touchBtn').forEach(btn=>{if(btn.dataset.bound)return;btn.dataset.bound='1';const k=btn.dataset.key;const action=btn.dataset.action;const down=e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);if(k)keys[k]=true;if(action==='pass')pressed.e=true;if(action==='switch')pressed.q=true;if(action==='camera')pressed.c=true;if(action==='shoot')keys.space=true};const up=e=>{e.preventDefault();if(k)keys[k]=false;if(action==='shoot')keys.space=false};btn.addEventListener('pointerdown',down,{passive:false});btn.addEventListener('pointerup',up,{passive:false});btn.addEventListener('pointercancel',up,{passive:false});btn.addEventListener('contextmenu',e=>e.preventDefault())})}
updateTouchControls();
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

let last=performance.now();function animate(now){const dt=Math.min(.033,Math.max(.001,(now-last)/1000));last=now;matchSeconds=Math.min(MATCH_LENGTH,matchSeconds+dt);if(goalLock>0)goalLock-=dt;updateControlled(dt);updateAI(dt);resolvePlayers();ballPhysics(dt);goalCheck();updateCamera(dt);updateClock();if(performance.now()>statusUntil&&statusEl.textContent!=='READY • MOVE WITH WASD / ARROWS')statusEl.textContent='MOVE • E PASS • SPACE SHOOT';renderer.render(scene,camera);for(const k in pressed)delete pressed[k];requestAnimationFrame(animate)}
setTimeout(()=>document.getElementById('loading').classList.add('hidden'),500);requestAnimationFrame(animate);
</script>
</body>
