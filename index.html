document.querySelectorAll('.touchBtn').forEach(b=>{const key=b.dataset.key,action=b.dataset.action;const down=e=>{e.preventDefault();if(key)keys[key]=true;else if(action==='pass')pressed.e=true;else if(action==='switch')pressed.q=true;else if(action==='camera')pressed.c=true;else if(action==='shoot')keys.space=true};const up=e=>{e.preventDefault();if(key)keys[key]=false;else if(action==='shoot')keys.space=false};b.addEventListener('pointerdown',down,{passive:false});b.addEventListener('pointerup',up,{passive:false});b.addEventListener('pointercancel',up,{passive:false});b.addEventListener('pointerleave',up,{passive:false})});
</script></body></html>
